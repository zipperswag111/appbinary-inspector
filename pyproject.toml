[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "appbinary-inspector"
version = "0.1.0"
description = "Safe static inspection and embedded-file extraction for application binaries."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "William Laurento"}]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent"]
dependencies = []

[project.scripts]
appbin = "appbinary_inspector.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/appbinary_inspector"]