[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "appbinary-inspector"
version = "0.7.1"
description = "Open-source lazy-card character model plus static binary inspection tools."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "William Laurento"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
torch = ["torch>=2.1"]
huggingface = ["transformers>=4.45", "accelerate>=0.30", "huggingface_hub>=0.25"]
huggingface-4bit = ["transformers>=4.45", "accelerate>=0.30", "huggingface_hub>=0.25", "bitsandbytes>=0.43"]

[project.scripts]
appbin = "appbinary_inspector.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/appbinary_inspector"]
