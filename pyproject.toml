[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "MathAdvPy"
version = "1.0.0"
description = "Math tools for algebra, geometry, trigonometry, precalculus, calculus, and statistics."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "William Laurento"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
mathadv = "mathadvpy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mathadvpy"]
